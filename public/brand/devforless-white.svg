<svg width="480" viewBox="0 0 480 120" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>DevForLess logo white</title>
  <desc>Logotipo DevForLess versão white para fundos escuros, fundo transparente</desc>

  <g transform="translate(60, 60)">
    <polygon points="0,-50 44,0 0,50 -44,0" fill="rgba(255,255,255,0.08)"/>
    <polygon points="0,-50 44,0 0,50 -44,0" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
    <polyline points="-3,-22 -20,0 -3,22" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="3,-22 20,0 3,22" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>
    <polyline points="5,-13 -2,2 5,2 -5,15" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="122" y="52" font-family="sans-serif" font-size="44" font-weight="500" fill="#ffffff" letter-spacing="-2">dev</text>
