  <line x1="122" y1="64" x2="420" y2="64" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
  <text x="122" y="80" font-family="sans-serif" font-size="10" font-weight="400" fill="rgba(255,255,255,0.3)" letter-spacing="2">IA QUE ENTREGA. DO BACKLOG AO DEPLOY.</text>
